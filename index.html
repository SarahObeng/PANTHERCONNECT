<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>PantherConnect</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
/* Layout: Instagram-style shell. Sidebar (desktop) or bottom nav (mobile), one centered content column. Purple primary, gold accent. */
:root{--bg:#F5F4F8;--surface:#FFFFFF;--surface-2:#F0EEF5;--line:#E3DFEC;--fg:#26232B;--fg-2:#5A5666;--fg-3:#7C7789;
--brand:#5B2C8C;--brand-strong:#44206B;--brand-text:#5B2C8C;--brand-soft:#EEE7F8;--on-brand:#FFFFFF;
--gold:#F0A800;--gold-soft:#FFF3D1;--gold-ink:#6B4A00;--on-gold:#2A1D00;
--good:#17724F;--good-soft:#DDF3EA;--warn:#A14A06;--warn-soft:#FDEBD3;--bad:#B42318;--bad-soft:#FBE3E0;
--shadow:0 1px 2px rgba(38,35,43,.06),0 10px 28px rgba(38,35,43,.07);
--fd:'Montserrat',system-ui,sans-serif;--fb:'Source Sans 3',system-ui,-apple-system,'Segoe UI',sans-serif}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#14111A;--surface:#1E1A27;--surface-2:#272233;--line:#37324A;--fg:#F1EEF7;--fg-2:#BDB7CC;--fg-3:#938DA4;
--brand:#7B48C4;--brand-strong:#9467DA;--brand-text:#C0A3F2;--brand-soft:#2D2342;--gold-soft:#3A2E0A;--gold-ink:#F6C453;
--good:#4FD1A1;--good-soft:#12342A;--warn:#F6A04D;--warn-soft:#3A2410;--bad:#FF8A80;--bad-soft:#3D1A18;--shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14111A;--surface:#1E1A27;--surface-2:#272233;--line:#37324A;--fg:#F1EEF7;--fg-2:#BDB7CC;--fg-3:#938DA4;
--brand:#7B48C4;--brand-strong:#9467DA;--brand-text:#C0A3F2;--brand-soft:#2D2342;--gold-soft:#3A2E0A;--gold-ink:#F6C453;
--good:#4FD1A1;--good-soft:#12342A;--warn:#F6A04D;--warn-soft:#3A2410;--bad:#FF8A80;--bad-soft:#3D1A18;--shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35);color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font:16px/1.45 var(--fb);background:var(--bg);color:var(--fg);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
h1,h2,h3{font-family:var(--fd);margin:0;line-height:1.2;text-wrap:balance}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:var(--fg)}
a{color:var(--brand-text)}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ic{flex:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:999px;border:1px solid transparent;background:var(--surface-2);font-weight:700;font-size:15px;white-space:nowrap}
.btn:hover{filter:brightness(.97)}
.btn-primary{background:var(--brand);color:var(--on-brand)}
.btn-primary:hover{background:var(--brand-strong);filter:none}
.btn-gold{background:var(--gold);color:var(--on-gold)}
.btn-line{background:transparent;border-color:var(--line);color:var(--fg)}
.btn-line.on{background:var(--brand-soft);border-color:var(--brand);color:var(--brand-text)}
.btn-sm{min-height:36px;padding:0 14px;font-size:14px}
.btn-block{width:100%}
.btn[disabled],.btn[aria-disabled="true"]{opacity:.5;cursor:not-allowed}
.icon-btn{display:inline-grid;place-items:center;width:44px;height:44px;border:0;border-radius:50%;background:transparent;position:relative}
.icon-btn:hover{background:var(--surface-2)}
.badge-dot{position:absolute;top:4px;right:3px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--gold);color:var(--on-gold);font:700 11px/18px var(--fb);text-align:center}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:14px}
.chip.on{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;background:var(--brand-soft);color:var(--brand-text);font-weight:700;font-size:12.5px}
.pill.gold{background:var(--gold-soft);color:var(--gold-ink)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.plain{background:var(--surface-2);color:var(--fg-2)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px}
.avatar{display:inline-grid;place-items:center;border-radius:50%;background:linear-gradient(135deg,var(--brand),#8D55CC);color:#fff;font:700 14px var(--fd);overflow:hidden;flex:none}
.avatar img{width:100%;height:100%;object-fit:cover}
.avatar.ring,.orglogo.ring{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--gold)}
.orglogo{display:inline-grid;place-items:center;border-radius:50%;color:#fff;font:700 13px var(--fd);flex:none}
/* shell */
.app{min-height:100vh}
.side{display:none}
.main{padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.topbar-in{display:flex;align-items:center;gap:8px;height:60px;max-width:960px;margin:0 auto;padding:0 max(12px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
.topbar .grow{flex:1;min-width:0}
.logo{display:inline-flex;align-items:center;gap:9px;font:800 19px var(--fd);color:var(--fg);text-decoration:none;border:0;background:none;padding:0}
.logo b{color:var(--brand-text);font-weight:800}
.logo .mark{width:32px;height:32px}
.tsearch{display:none}
.acct-chip{display:none;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--gold-soft);color:var(--gold-ink);font:700 13px var(--fb);border:1px solid var(--gold)}
.page{width:100%;max-width:640px;margin:0 auto;padding:16px max(16px,env(safe-area-inset-right,0px)) 32px max(16px,env(safe-area-inset-left,0px))}
.page.wide{max-width:960px}.page.mid{max-width:760px}
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));display:grid;grid-template-columns:repeat(5,1fr);align-items:center}
.bnav button{display:grid;justify-items:center;gap:2px;border:0;background:none;padding:6px 0;font:600 11px var(--fb);color:var(--fg-2);min-height:48px}
.bnav button.on{color:var(--brand-text)}
.bnav .plus{width:48px;height:48px;border-radius:50%;background:var(--gold);color:var(--on-gold);display:grid;place-items:center;justify-self:center;margin-top:-14px;box-shadow:var(--shadow)}
.bnav .plus.locked{background:var(--surface-2);color:var(--fg-3)}
@media(min-width:760px){
.side{display:flex;flex-direction:column;position:fixed;inset:0 auto 0 0;width:76px;z-index:30;background:var(--surface);border-right:1px solid var(--line);padding:18px 10px 16px max(10px,env(safe-area-inset-left,0px));gap:6px}
.main{margin-left:76px;padding-bottom:40px}
.bnav{display:none}
.logo.mobile-only{display:none}
.tsearch{display:flex;align-items:center;gap:8px;flex:1;max-width:420px;min-height:42px;border-radius:999px;background:var(--surface-2);padding:0 14px;border:1px solid transparent}
.tsearch input{flex:1;border:0;background:none;outline:none;min-width:0}
.tsearch:focus-within{border-color:var(--brand)}
.tsearch-icon{display:none}
.acct-chip{display:inline-flex}
}
@media(min-width:1100px){.side{width:244px;padding:22px 14px 16px max(14px,env(safe-area-inset-left,0px))}.main{margin-left:244px}.side .lbl{display:inline}}
.side .lbl{display:none}
.side .logo{margin:0 6px 14px}
.side .logo span{display:none}
@media(min-width:1100px){.side .logo span{display:inline}}
.nav-item{display:flex;align-items:center;gap:14px;min-height:48px;padding:0 13px;border-radius:14px;border:0;background:none;font:600 16px var(--fb);color:var(--fg);text-align:left;position:relative}
.nav-item:hover{background:var(--surface-2)}
.nav-item.on{background:var(--brand-soft);color:var(--brand-text);font-weight:700}
.nav-item.on::before{content:"";position:absolute;left:-4px;top:12px;bottom:12px;width:4px;border-radius:2px;background:var(--gold)}
.nav-item .badge-dot{top:6px;left:28px;right:auto}
.side-foot{margin-top:auto;position:relative}
.switcher{display:flex;align-items:center;gap:10px;width:100%;padding:8px;border-radius:14px;border:1px solid var(--line);background:var(--surface);text-align:left}
.switcher .who{display:none;min-width:0;flex:1}
.switcher .who b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.switcher .who small{color:var(--fg-3);font-size:12px}
@media(min-width:1100px){.switcher .who{display:block}}
.menu{position:absolute;bottom:calc(100% + 8px);left:0;width:280px;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:8px;z-index:50}
.menu button{display:flex;align-items:center;gap:10px;width:100%;padding:10px;border:0;background:none;border-radius:12px;text-align:left}
.menu button:hover{background:var(--surface-2)}
.menu small{display:block;color:var(--fg-3)}
</style>
<style>
/* feed + cards */
.greet{padding:4px 2px 14px}
.greet h1{font-size:24px}
.greet p{color:var(--fg-2);margin-top:4px}
.stories{display:flex;gap:14px;overflow-x:auto;padding:4px 2px 14px;scrollbar-width:none}
.stories::-webkit-scrollbar{display:none}
.story{display:grid;justify-items:center;gap:6px;border:0;background:none;width:68px;flex:none;font:600 12px var(--fb);color:var(--fg-2)}
.story span:last-child{max-width:68px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.home-grid{display:block}
.rail{display:none}
@media(min-width:1260px){.home-grid{display:grid;grid-template-columns:600px 300px;gap:32px;justify-content:center;max-width:960px;margin:0 auto}.home-grid .page{max-width:none;padding:16px 0 32px}.rail{display:block;padding-top:90px}}
.post{overflow:hidden;margin-bottom:18px;box-shadow:var(--shadow)}
.post-h{display:flex;align-items:center;gap:10px;padding:12px 14px}
.post-h .who{flex:1;min-width:0;text-align:left;border:0;background:none;padding:0}
.post-h .who b{display:flex;align-items:center;gap:5px;font-size:15px}
.post-h .who small{display:block;color:var(--fg-3);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.verified{color:var(--brand-text)}
.media{position:relative;aspect-ratio:5/4;background:var(--surface-2);width:100%;display:block;border:0;padding:0}
.flyer-svg,.flyer-img{width:100%;height:100%;display:block;object-fit:cover}
.media .corner{position:absolute;top:12px;left:12px}
.acts{display:flex;align-items:center;gap:2px;padding:6px 8px 0}
.act{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 10px;border:0;background:none;border-radius:12px;font:600 14px var(--fb);color:var(--fg)}
.act:hover{background:var(--surface-2)}
.act.on{color:var(--brand-text)}
.act.on.heart{color:#D6336C}
.act.on svg{animation:pop .35s ease}
.act.right{margin-left:auto}
@keyframes pop{0%{transform:scale(.7)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
.cap{padding:4px 16px 16px;display:grid;gap:10px}
.cap h3{font-size:18px}
.cap .desc{color:var(--fg-2);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.why{font-size:13px;color:var(--brand-text);font-weight:700;display:flex;gap:6px;align-items:center}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px;color:var(--fg-2)}
.meta span{display:inline-flex;align-items:center;gap:6px}
.when{font-style:normal;font-weight:700;color:var(--fg-3)}
.when.soon{color:var(--warn)}
.more{display:grid;place-items:center;padding:8px 0 24px}
/* explore */
.searchbox{display:flex;align-items:center;gap:10px;min-height:50px;padding:0 8px 0 16px;border-radius:999px;background:var(--surface);border:1.5px solid var(--line)}
.searchbox:focus-within{border-color:var(--brand)}
.searchbox input{flex:1;border:0;background:none;outline:none;min-width:0;font-size:16px}
.rowscroll{display:flex;gap:8px;overflow-x:auto;padding:12px 0 4px;scrollbar-width:none}
.rowscroll::-webkit-scrollbar{display:none}
.rowscroll .chip{flex:none}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:12px 0}
.fsel{display:grid;gap:4px;font-size:12px;font-weight:700;color:var(--fg-3);text-transform:uppercase;letter-spacing:.06em}
.fsel select,.field input,.field select,.field textarea{min-height:44px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);padding:0 12px;text-transform:none;letter-spacing:0;font-weight:400;font-size:16px;width:100%}
.field textarea{padding:10px 12px;min-height:110px;resize:vertical}
.field{display:grid;gap:6px;font-weight:700;font-size:14px}
.field .hint{font-weight:400;color:var(--fg-3);font-size:13px}
.field .err{color:var(--bad);font-weight:600;font-size:13px}
.field.bad input,.field.bad select,.field.bad textarea{border-color:var(--bad)}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:700px){.tiles{grid-template-columns:repeat(3,1fr);gap:14px}}
.tile{position:relative;aspect-ratio:1/1;border-radius:16px;overflow:hidden;cursor:pointer;background:var(--surface-2);border:1px solid var(--line)}
.tile .shade{position:absolute;inset:auto 0 0;padding:34px 12px 11px;background:linear-gradient(transparent,rgba(20,10,35,.88));color:#fff;display:grid;gap:2px}
.tile .shade b{font:700 14px/1.25 var(--fd);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tile .shade small{font-size:12.5px;opacity:.9}
.tile .tl{position:absolute;top:8px;left:8px}
.tile .tr{position:absolute;top:4px;right:4px;display:flex}
.tile .tr .icon-btn{width:38px;height:38px;color:#fff;background:rgba(20,10,35,.45)}
.tile .tr .icon-btn.on{background:var(--gold);color:var(--on-gold)}
.empty{text-align:center;padding:44px 20px;color:var(--fg-2);display:grid;gap:12px;justify-items:center}
.empty h3{color:var(--fg);font-size:18px}
/* detail */
.back{display:inline-flex;align-items:center;gap:6px;border:0;background:none;font-weight:700;color:var(--brand-text);min-height:44px;padding:0}
.hero{border-radius:20px;overflow:hidden;aspect-ratio:16/10;background:var(--surface-2)}
.d-title{font-size:26px;margin:14px 0 8px}
.d-acts{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.facts div{background:var(--surface);padding:12px 14px}
.facts small{display:block;color:var(--fg-3);font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.06em}
.sec{margin-top:22px}
.sec h2{font-size:18px;margin-bottom:8px}
.sec ul{margin:0;padding-left:20px;display:grid;gap:6px;color:var(--fg-2)}
.note{display:flex;gap:10px;padding:12px 14px;border-radius:14px;background:var(--gold-soft);color:var(--gold-ink);font-size:14px;margin-top:18px}
.linkbox{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:14px;background:var(--surface-2);word-break:break-all;font-weight:600}
/* saved */
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin:12px 0}
.srow{display:grid;grid-template-columns:96px 1fr;gap:14px;padding:12px;margin-bottom:12px;align-items:start}
.srow.fresh{box-shadow:0 0 0 3px var(--gold)}
.srow .thumb{width:96px;height:96px;border-radius:14px;overflow:hidden;background:var(--surface-2)}
.srow h3{font-size:16px;margin:2px 0 6px;text-align:left;border:0;background:none;padding:0;cursor:pointer;color:var(--fg)}
.srow .chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.srow .bot{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:0 12px;min-height:36px;font:600 13px var(--fb)}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--brand);color:var(--on-brand)}
</style>
<style>
/* calendar, notifications, profile, create, modals, auth */
.cal-grid{display:grid;grid-template-columns:1fr;gap:16px}
@media(min-width:860px){.cal-grid{grid-template-columns:1.25fr 1fr}}
.cal{padding:14px}
.cal-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.cal-h h2{font-size:18px}
.dow,.days{display:grid;grid-template-columns:repeat(7,1fr);text-align:center}
.dow span{font-size:12px;font-weight:700;color:var(--fg-3);padding:6px 0}
.day{aspect-ratio:1/1;min-height:44px;border:0;background:none;border-radius:12px;display:grid;align-content:center;justify-items:center;gap:3px;font-weight:600;position:relative}
.day.out{color:var(--fg-3);opacity:.55}
.day.today{box-shadow:inset 0 0 0 2px var(--gold)}
.day.sel{background:var(--brand);color:var(--on-brand)}
.dots{display:flex;gap:3px;height:6px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--brand)}
.dots i.d{background:var(--gold)}.dots i.r{background:var(--fg-3)}
.day.sel .dots i{background:#fff}.day.sel .dots i.d{background:var(--gold)}
.legend{display:flex;gap:14px;font-size:13px;color:var(--fg-2);margin-top:8px;flex-wrap:wrap}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;background:var(--brand)}
.legend i.d{background:var(--gold)}.legend i.r{background:var(--fg-3)}
.panel{padding:14px 16px;margin-bottom:14px}
.panel h2{font-size:16px;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.ev{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.ev:first-of-type{border-top:0}
.ev.fresh{background:var(--gold-soft);border-radius:12px;padding:10px;margin:2px -4px}
.ev .dt{flex:none;width:48px;text-align:center;border-radius:12px;background:var(--brand-soft);color:var(--brand-text);padding:5px 0;font:700 18px/1 var(--fd)}
.ev .dt small{display:block;font:700 10px var(--fb);text-transform:uppercase;letter-spacing:.08em}
.ev.deadline .dt{background:var(--gold-soft);color:var(--gold-ink)}
.ev .tx{flex:1;min-width:0}
.ev .tx b{display:block;font-size:15px}
.ev .tx small{color:var(--fg-3)}
.rem{display:flex;gap:10px;padding:10px 12px;border-radius:12px;background:var(--gold-soft);color:var(--gold-ink);margin-bottom:8px;font-weight:600;font-size:14.5px;width:100%;text-align:left;border:0}
/* notifications */
.nrow{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;padding:14px;border:0;border-top:1px solid var(--line);background:var(--surface)}
.nrow:first-child{border-top:0}
.nrow:hover{background:var(--surface-2)}
.nrow .nic{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--brand-soft);color:var(--brand-text);flex:none}
.nrow .tx{flex:1;min-width:0}
.nrow small{color:var(--fg-3)}
.unread{width:10px;height:10px;border-radius:50%;background:var(--gold);flex:none;margin-top:6px}
.list{overflow:hidden}
.sec-t{font:700 13px var(--fb);color:var(--fg-3);text-transform:uppercase;letter-spacing:.08em;margin:18px 4px 8px}

const gearPts=(cx0,cy,r1,r2,n)=>{const p=[];for(let i=0;i<n*4;i++){const a=(i/(n*4))*Math.PI*2;const r=(i%4<2)?r2:r1;p.push((cx0+r*Math.cos(a)).toFixed(1)+','+(cy+r*Math.sin(a)).toFixed(1));}return p.join(' ');};
function Motif({k,ac}){const w='rgba(255,255,255,.24)';
 if(k==='gear')return html`<g fill="none" strokeWidth="6" strokeLinejoin="round"><polygon points=${gearPts(590,390,120,155,10)} stroke=${w}/><circle cx="590" cy="390" r="48" stroke=${w}/><polygon points=${gearPts(450,530,56,78,7)} stroke=${ac} opacity=".85"/><circle cx="450" cy="530" r="20" stroke=${ac} opacity=".85"/></g>`;
 if(k==='pulse')return html`<g fill="none" strokeLinecap="round" strokeLinejoin="round"><circle cx="640" cy="340" r="120" stroke=${w} strokeWidth="5"/><circle cx="640" cy="340" r="76" stroke=${w} strokeWidth="5"/><path d="M0 430H190L225 350L275 500L330 260L390 540L430 430H800" stroke=${ac} strokeWidth="9"/></g>`;
 if(k==='nodes'){const P=[[560,230],[690,300],[600,400],[720,450],[520,490],[650,545],[450,350]];const E=[[0,1],[1,2],[2,3],[2,4],[4,5],[3,5],[0,6],[6,2]];
  return html`<g><g stroke=${w} strokeWidth="4">${E.map((e,i)=>html`<line key=${i} x1=${P[e[0]][0]} y1=${P[e[0]][1]} x2=${P[e[1]][0]} y2=${P[e[1]][1]}/>`)}</g>${P.map((p,i)=>html`<circle key=${i} cx=${p[0]} cy=${p[1]} r=${i%3===0?18:12} fill=${i%3===0?ac:'rgba(255,255,255,.55)'}/>`)}</g>`;}
 if(k==='helix'){const a=[],b=[],R=[];for(let y=130;y<=540;y+=8){const s=70*Math.sin((y-130)/45);a.push((630+s).toFixed(1)+','+y);b.push((630-s).toFixed(1)+','+y);}

 if(k==='bars')return html`<g>${[90,150,120,230,300].map((h,i)=>html`<rect key=${i} x=${470+i*56} y=${540-h} width="38" height=${h} rx="8" fill=${i===4?ac:'rgba(255,255,255,.24)'}/>`)}</g>`;
 if(k==='cal')return html`<g fill="none" stroke=${w} strokeWidth="5"><rect x="490" y="230" width="240" height="250" rx="20"/><line x1="490" y1="290" x2="730" y2="290"/>${[0,1,2].map(i=>html`<line key=${i} x1=${570+i*80} y1="290" x2=${570+i*80} y2="480"/>`)}${[0,1].map(i=>html`<line key=${i} x1="490" y1=${355+i*62} x2="730" y2=${355+i*62}/>`)}<rect x="578" y="362" width="64" height="52" rx="10" fill=${ac} stroke="none"/></g>`;
 return html`<g fill="none" stroke=${w} strokeWidth="6">${[60,110,160,210].map((r,i)=>html`<circle key=${i} cx="610" cy="380" r=${r} stroke=${i===1?ac:w}/>`)}</g>`;}

function monthCells(y,m){const f=new Date(y,m,1,12);const st=new Date(y,m,1-f.getDay(),12);
 return Array.from({length:42},(_,i)=>{const d=new Date(st.getFullYear(),st.getMonth(),st.getDate()+i,12);return{iso:iso(d),day:d.getDate(),inMonth:d.getMonth()===m};});}
function remindersFor(cal,opps){const out=[];
 cal.slice().sort((a,b)=>pd(a.date)-pd(b.date)).forEach(e=>{const d=dayDiff(e.date);if(d<0)return;const o=e.oppId?byId(opps,e.oppId):null;
  if(e.kind==='event'&&d<=1)out.push({id:e.id,oppId:e.oppId,text:'Your '+e.title+' is '+(d===0?'today':'tomorrow')+(e.time?' at '+e.time.split(' – ')[0]:'')+'.'});
  else if(e.kind==='deadline'&&d<=14)out.push({id:e.id,oppId:e.oppId,text:'Your saved '+(o&&o.cat==='Internships'?'internship':'application')+' deadline is approaching: '+e.title+' closes '+(d===0?'today':'in '+d+' days')+'.'});
  else if(e.kind==='reminder'&&d<=7)out.push({id:e.id,oppId:null,text:'Reminder: '+e.title+' ('+fmtLong(e.date)+').'});});
 return out;}
